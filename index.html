<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6dce8"><meta name="description" content="Мій НМТ 2027 — ніжний трекер підготовки">
<link rel="manifest" href="manifest.webmanifest">
<title>Мій НМТ 2027</title>
<style>
:root{--pink:#f4d6e3;--rose:#d98eae;--pale:#fff7fa;--lav:#e9e3f7;--mint:#e2f0e8;--ink:#554653;--muted:#927f8d;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff8fb,#f7f2fb);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:26px 18px 20px;text-align:center;background:linear-gradient(120deg,#f6dce8,#eee8fa);border-radius:0 0 28px 28px}
h1{margin:0;font-size:27px;font-weight:800;letter-spacing:.2px}header p{margin:7px 0 0;color:#826e7d;font-size:14px}
main{max-width:900px;margin:auto;padding:16px}
.summary{background:#fff;border:1px solid #f0e4eb;border-radius:20px;padding:16px;margin:0 0 15px;box-shadow:0 5px 18px #d8bfd01c}
.sumtop{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}.percent{color:#b66d91}
.track{height:10px;background:#f3eaf0;border-radius:20px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#e9aec8,#cbbbe9);border-radius:20px;transition:width .25s}
.subjects{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.subject{border:1px solid #eee1e9;background:#fff;border-radius:15px;padding:11px 5px;color:var(--ink);font-weight:700;font-size:12px;cursor:pointer}
.subject.active{background:#f5dce8;border-color:#e7b9ce;color:#87536e}
.tools{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
input,select{border:1px solid #eadde6;background:#fff;color:var(--ink);padding:11px 12px;border-radius:12px;font:inherit;min-width:0}
input{flex:1;min-width:160px}
.module{background:#fff;border:1px solid #f0e5eb;border-radius:18px;margin:11px 0;overflow:hidden}
.modulehead{padding:14px 15px;background:#fcf4f8;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font-weight:750}
.modulehead small{color:var(--muted);font-weight:500;white-space:nowrap}
.topic{padding:11px 14px;border-top:1px solid #f4edf1;display:flex;align-items:center;gap:10px}
.topic label{flex:1;font-size:14px;line-height:1.35}
.topic select{padding:7px 8px;font-size:12px;max-width:126px}
.topic.done label{text-decoration:line-through;color:#9b8d97}
.topic input[type=checkbox]{accent-color:#c77fa1;width:18px;height:18px;flex:none}
.empty{text-align:center;padding:28px;color:var(--muted)}
footer{text-align:center;color:#9a8793;font-size:12px;padding:22px}
.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 2px}
button.secondary{border:1px solid #eadde6;background:#fff;color:#8b6b7d;border-radius:12px;padding:9px 12px;cursor:pointer}
@media(max-width:520px){.subjects{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}.topic{align-items:flex-start}.topic select{max-width:112px}}
</style></head>
<body>
<header><h1>♡ Мій НМТ 2027</h1><p>Твій спокійний простір для підготовки</p></header>
<main>
<section class="summary"><div class="sumtop"><span>Мій загальний прогрес</span><span class="percent" id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div><div style="font-size:12px;color:#9a8793;margin-top:8px" id="count">0 із 200 тем завершено</div></section>
<nav class="subjects" id="subjects"></nav>
<div class="actions"><strong id="subjectTitle">Математика</strong><button class="secondary" id="reset">Скинути прогрес</button></div>
<div class="tools"><input id="search" placeholder="Знайти тему…"><select id="filter"><option value="all">Усі теми</option><option value="todo">Не почато</option><option value="doing">Вивчаю</option><option value="review">Повторити</option><option value="done">Готово</option></select></div>
<div id="content"></div>
</main>
<footer>Прогрес зберігається автоматично на цьому пристрої ♡</footer>

ідація козацької автономії"], "Україна у XIX — на початку XX ст.": ["Українські землі у складі Російської та Австрійської імперій", "Початок українського національного відродження", "Кирило-Мефодіївське братство", "Реформи та суспільні рухи другої половини XIX ст.", "Громадівський рух і політичні партії", "Українські землі на початку XX ст.", "Революція 1905–1907 років в Україні", "Україна в Першій світовій війні"], "Українська революція та міжвоєнний період": ["Українська революція 1917 року", "Українська Центральна Рада та Універсали", "Гетьманат Павла Скоропадського", "Директорія УНР", "ЗУНР та Акт Злуки", "Україна в боротьбі за незалежність у 1919–1921 роках", "НЕП і політика українізації", "Індустріалізація та колективізація", "Голодомор 1932–1933 років", "Масові репресії та «Розстріляне відродження»", "Західноукраїнські землі у 1920–1930-х роках"], "Друга світова та повоєнний час": ["Українські землі напередодні Другої світової війни", "Початок Другої світової війни та приєднання західноукраїнських земель", "Нацистська окупація України", "Рух Опору та УПА", "Вигнання нацистських окупантів з України", "Повоєнна відбудова", "Радянізація західних областей", "Хрущовська відлига", "Шістдесятники та дисидентський рух", "Застій і криза радянської системи", "Перебудова та Чорнобильська катастрофа"], "Незалежна Україна": ["Проголошення незалежності України", "Референдум 1 грудня 1991 року", "Конституція України 1996 року", "Політичний та економічний розвиток України у 1990-х роках", "Помаранчева революція", "Революція Гідності", "Російська агресія проти України з 2014 року", "Повномасштабне вторгнення Росії у 2022 році"]}, "Англійська мова": {"Grammar — граматика": ["Present Simple", "Present Continuous", "Present Perfect", "Present Perfect Continuous", "Past Simple", "Past Continuous", "Past Perfect", "Future Simple та be going to", "Future Continuous / Future Perfect", "Узгодження часів", "Passive Voice", "Conditionals: zero, first, second, third", "Wish / If only", const subjects = Object.keys(DATA);
const KEY='mii-nmt-2027-progress-v1';
let progress={}; try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let current=subjects[0], opened={};
const $=id=>document.getElementById(id);
function idFor(s,m,t){return [s,m,t].join('|||')}
function status(id){return progress[id]||'todo'}
function save(){localStorage.setItem(KEY,JSON.stringify(progress));render()}
function allTopics(){let a=[];for(const s of subjects)for(const [m,ts] of Object.entries(DATA[s]))for(const t of ts)a.push(idFor(s,m,t));return a}
function updateSummary(){const ids=allTopics(),done=ids.filter(x=>status(x)==='done').length;const pct=Math.round(done/ids.length*100);$('percent').textContent=pct+'%';$('fill').style.width=pct+'%';$('count').textContent=`${done} із ${ids.length} тем завершено`}
function renderNav(){$('subjects').innerHTML=subjects.map(s=>`<button class="subject ${s===current?'active':''}" data-s="${s}">${s==='Історія України'?'Історія':s==='Українська мова'?'Укр. мова':s==='Математика'?'Математика':'Англійська'}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{current=b.dataset.s;render()})}
function render(){renderNav();$('subjectTitle').textContent=current;updateSummary();const q=$('search').value.trim().toLowerCase(),f=$('filter').value;let out='';
for(const [m,ts] of Object.entries(DATA[current])){let rows=ts.map(t=>{const id=idFor(current,m,t),st=status(id);if(q&&!t.toLowerCase().includes(q))return '';if(f!=='all'&&st!==f)return '';return `<div class="topic ${st==='done'?'done':''}"><input type="checkbox" aria-label="Позначити готовою" data-check="${encodeURIComponent(id)}" ${st==='done'?'checked':''}><label>${t}</label><select data-status="${encodeURIComponent(id)}"><option value="todo" ${st==='todo'?'selected':''}>Не почато</option><option value="doing" ${st==='doing'?'selected':''}>Вивчаю</option><option value="review" ${st==='review'?'selected':''}>Повторити</option><option value="done" ${st==='done'?'selected':''}>Готово</option></select></div>`}).join('');
if(rows){const count=ts.filter(t=>status(idFor(current,m,t))==='done').length;out+=`<section class="module"><div class="modulehead" data-module="${encodeURIComponent(m)}"><span>${m}</span><small>${count}/${ts.length} готово　⌄</small></div><div class="modulebody">${rows}</div></section>`}}
$('content').innerHTML=out||'<div class="empty">За цим запитом тем не знайдено ♡</div>';
document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{const id=decodeURIComponent(el.dataset.check);progress[id]=el.checked?'done':(status(id)==='done'?'todo':status(id));save()});
document.querySelectorAll('[data-status]').forEach(el=>el.onchange=()=>{progress[decodeURIComponent(el.dataset.status)]=el.value;save()});
document.querySelectorAll('[data-module]').forEach(el=>el.onclick=()=>{const body=el.nextElementSibling;body.hidden=!body.hidden;el.querySelector('small').textContent=el.querySelector('small').textContent.replace(/[⌄⌃]$/,'')+(body.hidden?'　⌃':'　⌄')});
}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);
$('reset').onclick=()=>{if(confirm('Скинути весь збережений прогрес з усіх предметів?')){progress={};save()}};
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
